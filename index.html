    <!-- GitHub Pages cannot send COOP/COEP headers. This service worker adds

         the page once; on hosts that already set the headers it does nothing. -->

         the initZ3 global that the bundled z3-solver/browser module consumes. -->
    <script src="./dist/z3-built.js"></script>
    <script type="module" src="./dist/app.js"></script>
  </head>
