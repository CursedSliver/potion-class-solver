name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test solver
        run: npm run test:solver

      - name: Build production bundle
        run: |
          set -euo pipefail
          rm -rf dist
          npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          required=(
            index.html
            coi-serviceworker.js
            dist/app.js
            dist/index.css
            dist/z3-built.js
            dist/z3-built.wasm
          )
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty build output: $file"
              exit 1
            fi
          done
          grep -q 'src="./coi-serviceworker.js"' index.html
          grep -q 'href="./dist/index.css"' index.html
          grep -q 'src="./dist/app.js"' index.html
          if grep -qE '(href|src)="/[^/]' index.html; then
            echo "::error::index.html contains root-absolute asset URLs, which break on Pages subpaths"
            exit 1
          fi
          echo "Build output:"
          du -h index.html coi-serviceworker.js dist/* | sort -h

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html coi-serviceworker.js _site/
          cp -R dist _site/dist
          echo "Staged site:"
          find _site -type f | sort

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: potion-class-solver-site
          # index.html references ./dist/*, so serve the artifact root.
          path: _site/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: potion-class-solver-site
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
